spring:
datasource:
  url: jdbc:postgresql://127.0.0.1:5433/pizzeria
  username: pizzeria
  password: pizzeria
  driver-class-name: org.postgresql.Driver
jpa:
  database-platform: org.hibernate.dialect.PostgreSQLDialect
  hibernate:
    ddl-auto: update
  show-sql: true



scheduler:
  supply-check:
    interval: 100000