services:
  postgres:
    image: postgres:latest
    container_name: pizzeria-postgres
    environment:
      POSTGRES_USER: pizzeria
      POSTGRES_PASSWORD: pizzeria
      POSTGRES_DB: pizzeria
    ports:
      - "5433:5432"  # Zmiana na standardowy port PostgreSQL
    networks:
      - pizzeria-network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pizzeria"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: pizzeria-rabbitmq
    ports:
      - "5672:5672"   # AMQP port
      - "15672:15672" # Management UI
    networks:
      - pizzeria-network
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest

networks:
  pizzeria-network:
    driver: bridge

volumes:
  postgres_data: